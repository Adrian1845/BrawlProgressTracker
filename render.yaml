services:
  - type: web
    name: brawl-progress-tracker-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BRAWL_STARS_TOKEN
        sync: false
      - key: FIXIE_URL
        sync: false
      - key: CORS_ORIGINS
        value: http://localhost:4321,http://127.0.0.1:4321,https://your-frontend.vercel.app
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
